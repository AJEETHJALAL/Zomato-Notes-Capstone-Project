<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zomato Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header id="top-nav">
        <div class="brand">Zomato Notes</div>
        <nav>
            <a href="#notes">Notes</a>
            <a href="#add-note">Add Note</a>
            <a href="#category-tree">Tags</a>
        </nav>
    </header>
    <main>
        <section class="sidebar" id="category-tree">
            <h2>Tag Tree</h2>
            <div id="tree-root"></div>
        </section>
        <section class="content">
            <div class="two-column">
                <div class="left-col">
                    <section class="panel" id="add-note">
                        <h2>Add Note</h2>
                        <form id="note-form">
                            <div class="form-group">
                                <label for="note-title">Title</label>
                                <input id="note-title" name="title" required maxlength="120" />
                            </div>
                            <div class="form-group">
                                <label for="note-content">Content</label>
                                <textarea id="note-content" name="content" required rows="4"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="note-tag">Tag</label>
                                <input id="note-tag" name="tag" />
                            </div>
                            <div class="form-group">
                                <label for="note-attachment"><span class="attach-icon">📎</span> Attach files</label>
                                <input id="note-attachment" name="attachment" type="file" accept="image/*,application/pdf" />
                            </div>
                            <div class="form-group">
                                <label for="note-owner">Owner ID</label>
                                <input id="note-owner" name="owner_id" type="number" value="1" min="1" required />
                            </div>
                            <div id="form-error" class="error"></div>
                            <button type="submit">Create note</button>
                        </form>
                    </section>
                </div>
                <div class="right-col">
                    <section class="panel" id="search-panel">
                        <h2>Search</h2>
                        <div class="control-row">
                            <label for="plain-search">Filter notes by title or tag</label>
                            <input id="plain-search" type="search" placeholder="Search notes..." />
                        </div>
                        <div id="loading-message" class="info">Loading notes…</div>
                        <div id="error-message" class="error"></div>
                    </section>
                    <section class="panel" id="smart-search-panel">
                        <h2>Smart Search (AI)</h2>
                        <div class="control-row">
                            <input id="smart-search-query" type="text" placeholder="Semantic query" />
                            <button id="smart-search-btn" type="button">Search AI</button>
                        </div>
                        <div id="smart-results"></div>
                        <button id="reset-filters-btn" type="button" class="secondary">Reset all filters</button>
                        </section>
                </div>
            </div>
            <section class="panel" id="quick-tags-panel">
                <h2>Quick Tag Jump</h2>
                <div class="button-row">
                    <button type="button" class="quick-tag-btn" data-tag="work">work</button>
                    <button type="button" class="quick-tag-btn" data-tag="health">health</button>
                    <button type="button" class="quick-tag-btn" data-tag="recipes">recipes</button>
                    <button type="button" class="quick-tag-btn" data-tag="travel">travel</button>
                    <button type="button" class="quick-tag-btn" data-tag="random">random</button>
                </div>
                <div id="quick-find-result"></div>
            </section>
            <section class="panel" id="notes">
                <h2>Notes</h2>
                <div class="control-row" id="notes-controls">
                    <div class="form-group">
                        <label for="notes-tag-filter">Filter by tag</label>
                        <select id="notes-tag-filter">
                            <option value="">All tags</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="notes-sort-order">Sort by</label>
                        <select id="notes-sort-order">
                            <option value="created_desc">Newest first</option>
                            <option value="created_asc">Oldest first</option>
                            <option value="title_asc">Title A → Z</option>
                            <option value="title_desc">Title Z → A</option>
                        </select>
                    </div>
                </div>
                <div id="notes-list"></div>
            </section>
        </section>
    </main>
    <footer>
        <p>Built for Zomato Notes capstone.</p>
    </footer>
    <script src="mock-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
