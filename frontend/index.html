<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zomato Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
        <div id="toast" class="toast"></div>
    <section id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <h1>Welcome to Zomato Notes</h1>
            <p>Login to continue or create a new account.</p>
            <div class="auth-actions auth-tabs" role="tablist" aria-label="Authentication tabs">
                <button id="show-login-btn" type="button" role="tab" aria-selected="true" aria-controls="login-form" class="tab-btn active">Login</button>
                <button id="show-register-btn" type="button" role="tab" aria-selected="false" aria-controls="register-form" class="tab-btn">Create Account</button>
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" required />
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-field">
                        <input id="login-password" type="password" required />
                        <button id="toggle-login-password" type="button" class="eye-btn" aria-label="Toggle login password"><span class="material-symbols-outlined">visibility_off</span></button>
                    </div>
                </div>
                <button type="submit">Login</button>
            </form>

            <form id="register-form" class="auth-form" style="display:none;">
                <div class="form-group">
                    <label for="register-name">Name</label>
                    <input id="register-name" type="text" required />
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input id="register-email" type="email" required />
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <div class="password-field">
                        <input id="register-password" type="password" minlength="8" required />
                        <button id="toggle-register-password" type="button" class="eye-btn" aria-label="Toggle register password"><span class="material-symbols-outlined">visibility_off</span></button>
                    </div>
                </div>
                <button type="submit">Create Account</button>
            </form>

            <div id="auth-status" class="info"></div>
        </div>
    </section>

    <div id="app-shell" style="display:none;">
        <header id="top-nav">
            <div class="brand-wrap">
                <img
                    id="delivery-biker-gif"
                    src="assets/delivery-man-bike.gif"
                    alt="Delivery biker"
                />
                <div class="brand">Zomato Notes</div>
            </div>
            <nav>
                <a class="nav-link" href="#notes">Notes</a>
                <a class="nav-link" href="#add-note">Add Note</a>
                <a class="nav-link" href="#category-tree">Search</a>
                <a class="nav-link" href="#quick-tags-panel">Quick Tag Jump</a>
            </nav>
            <div class="auth-inline">
                <span id="signed-user-label"></span>
                <button id="profile-btn" type="button" class="btn-indigo">Profile</button>
                <button id="sign-out-btn" type="button" class="secondary">Sign out</button>
            </div>
        </header>

        <div id="profile-modal" class="modal-overlay" style="display:none;">
            <div class="modal-card">
                <h3>Profile</h3>
                <div class="form-group modal-field">
                    <label for="profile-id">ID#</label>
                    <input id="profile-id" type="text" readonly />
                </div>
                <div class="form-group modal-field">
                    <label for="profile-name">Name</label>
                    <input id="profile-name" type="text" readonly />
                </div>
                <div class="form-group modal-field">
                    <label for="profile-email">Email</label>
                    <input id="profile-email" type="email" />
                </div>
                <div id="profile-status" class="info"></div>
                <div class="modal-actions">
                    <button id="profile-save-btn" type="button" class="btn-green">Save Email</button>
                    <button id="profile-close-btn" type="button" class="secondary">Close</button>
                </div>
            </div>
        </div>
        <main>
            <section class="sidebar panel" id="category-tree">
                <section id="quick-tags-panel" class="quick-jump-tree-panel">
                    <h2>Quick Tag Jump</h2>
                    <div class="form-group quick-tag-search-wrap">
                        <label for="quick-tag-search">Selected tags</label>
                        <input id="quick-tag-search" type="search" placeholder="Select Tags from Tag Tree..." readonly />
                    </div>
                    <div id="quick-tag-pills" class="quick-tag-pills"></div>
                    <div class="button-row quick-metrics">
                        <button id="quick-clear-filters-btn" type="button" class="secondary small-button">Clear filter</button>
                        <button type="button" id="quick-tag-summary-btn" class="small-button btn-indigo">count&gt;1</button>
                        <button type="button" id="quick-long-notes-btn" class="small-button btn-green">Long-notes</button>
                    </div>
                    <div id="quick-find-result"></div>
                </section>
                <h2>Tag Tree</h2>
                <div id="tree-root"></div>
            </section>
            <section class="content">
                <div class="two-column">
                    <div class="left-col">
                        <section class="panel" id="add-note">
                            <h2>Add Note</h2>
                            <form id="note-form">
                                <div class="form-group">
                                    <label for="note-title">Title</label>
                                    <input id="note-title" name="title" required maxlength="120" />
                                </div>
                                <div class="form-group">
                                    <label for="note-content">Content</label>
                                    <textarea id="note-content" name="content" required rows="4"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="note-tag">Tag</label>
                                    <input id="note-tag" name="tag" />
                                </div>
                                <div class="form-group">
                                    <label for="note-attachment"><span class="attach-icon">📎</span> Attach files</label>
                                    <input id="note-attachment" name="attachment" type="file" accept="image/*,application/pdf" />
                                </div>
                                <div id="form-error" class="error"></div>
                                <button type="submit" class="btn-green">Create note</button>
                            </form>
                        </section>
                    </div>
                    <div class="right-col">
                        <section class="panel" id="search-panel">
                            <h2>Search</h2>
                            <div class="control-row">
                                <label for="plain-search">Filter notes by title or tag</label>
                                <input id="plain-search" type="search" placeholder="Search notes..." />
                            </div>
                            <div id="loading-message" class="info">Loading notes…</div>
                            <div id="error-message" class="error"></div>
                        </section>
                        <section class="panel" id="smart-search-panel">
                            <h2>Smart Search (AI)</h2>
                            <div class="control-row">
                                <input id="smart-search-query" type="text" placeholder="Search by intent, keywords, synonyms..." />
                            </div>

                            <div id="smart-search-meta" class="info" style="display: none; margin: 0.5rem 0; font-size: 0.9rem; color: #666;"></div>
                            <button id="reset-filters-btn" type="button">Reset all filters</button>
                            <div class="bulk-upload-panel">
                                <h3>Bulk import notes</h3>
                                <form id="bulk-import-form">
                                    <div class="form-group">
                                        <label for="bulk-import-file">Sample .txt file</label>
                                        <input id="bulk-import-file" type="file" accept=".txt" required />
                                    </div>
                                    <button type="submit" class="btn-green">Upload file</button>
                                </form>
                                <div id="import-status" class="info"></div>
                            </div>
                        </section>
                    </div>
                </div>
                <section class="panel" id="notes">
                    <h2>Notes</h2>
                    <div class="control-row" id="notes-controls">
                        <div class="form-group">
                            <label for="notes-tag-filter">Filter by tag</label>
                            <select id="notes-tag-filter">
                                <option value="">All tags</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="notes-sort-order">Sort by</label>
                            <select id="notes-sort-order">
                                <option value="created_desc">Newest first</option>
                                <option value="created_asc">Oldest first</option>
                                <option value="title_asc">Title A → Z</option>
                                <option value="title_desc">Title Z → A</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="quick-id-filter">Filter by Owner ID</label>
                            <input id="quick-id-filter" type="number" placeholder="Owner ID" min="1" />
                        </div>
                    </div>
                    <div id="notes-list"></div>
                    <div id="notes-pagination" class="notes-pagination"></div>
                </section>
            </section>
        </main>
        <footer>
            <footer style="text-align: center;">
            <p>&copy; 2026 AJEETH JALAL PASHA Built for Zomato Notes capstone.</p>
        </footer>
    </div>
    <script src="mock-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
